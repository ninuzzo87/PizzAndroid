name: Build Dough Pizza APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q DoughPizzaAndroid_v2_source.zip
          find . -type f \( -name settings.gradle.kts -o -name settings.gradle \)

      - name: Build APK
        run: |
          PROJECT=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "File settings.gradle non trovato"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dough-Pizza-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
