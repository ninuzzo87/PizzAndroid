name: Build Dough Pizza APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q DoughPizzaAndroid_v2_source.zip

       - name: Fix Java target
        run: |
          python3 <<'PY'
          import pathlib
          import re

          for p in pathlib.Path('.').rglob('*'):
              if p.is_file() and (p.name.endswith('.gradle') or p.name.endswith('.gradle.kts')):
                  s = p.read_text()
                  old = s
                  s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
                  s = s.replace('JavaVersion.VERSION_1_7', 'JavaVersion.VERSION_17')
                  s = re.sub(r'(?i)(jvmTarget\s*=\s*["\'])1\.8(["\'])', r'\g<1>17\2', s)
                  s = re.sub(r'(?i)(sourceCompatibility\s*=\s*["\'])1\.8(["\'])', r'\g<1>17\2', s)
                  s = re.sub(r'(?i)(targetCompatibility\s*=\s*["\'])1\.8(["\'])', r'\g<1>17\2', s)
                  if s != old:
                      p.write_text(s)
                      print('Corretto:', p)
          PY

      - name: Build APK
        run: |
          PROJECT=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "File settings.gradle non trovato"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dough-Pizza-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
